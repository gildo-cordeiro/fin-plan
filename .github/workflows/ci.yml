name: CI (Testes & Build)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-web:
    name: Test & Build Frontend (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários (Vitest)
        run: npm test

      - name: Executar build de produção (TypeScript + Vite)
        run: npm run build

  test-api:
    name: Test & Build API (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/api/go.sum

      - name: Baixar dependências
        run: go mod download

      - name: Executar go vet
        run: go vet ./...

      - name: Executar testes unitários
        run: go test -v ./...

      - name: Compilar binário da API
        run: go build -v ./cmd/api

